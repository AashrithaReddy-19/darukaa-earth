# Render Blueprint for Darukaa.Earth backend + PostGIS database.
# Docs: https://render.com/docs/blueprint-spec
#
# Usage:
#   1. Push this repo to GitHub.
#   2. In the Render dashboard: New -> Blueprint -> select this repository.
#   3. Render will provision the "darukaa-db" PostgreSQL database and the
#      "darukaa-backend" web service defined below.
#   4. Set the secret env vars marked "sync: false" in the Render dashboard
#      after the first deploy (JWT_SECRET_KEY, etc.) — Render will prompt you.
#   5. Once live, copy the backend's public URL into the frontend's
#      VITE_API_BASE_URL (Vercel project settings) as https://<service>.onrender.com
#      (no /api/v1 suffix — the frontend appends that itself)

databases:
  - name: darukaa-db
    databaseName: darukaa_earth
    user: darukaa
    plan: free
    postgresMajorVersion: 16
    ipAllowList: []

services:
  - type: web
    name: darukaa-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: darukaa-db
          property: connectionString
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: FRONTEND_ORIGIN
        sync: false
      - key: ENVIRONMENT
        value: production
    preDeployCommand: alembic upgrade head

# NOTE ON POSTGIS: Render's managed Postgres does not enable the PostGIS
# extension by default. After the database is created, connect with psql
# (Render dashboard -> darukaa-db -> "Connect") and run:
#   CREATE EXTENSION IF NOT EXISTS postgis;
# This is also included as the first Alembic migration, which runs it via
# `CREATE EXTENSION IF NOT EXISTS postgis;` — but the database user needs
# sufficient privilege, which Render's default user has.
