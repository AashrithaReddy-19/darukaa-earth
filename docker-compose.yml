name: darukaa-earth

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: darukaa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-darukaa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-darukaa_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-darukaa_earth}
    ports:
      - "5432:5432"
    volumes:
      - darukaa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-darukaa} -d ${POSTGRES_DB:-darukaa_earth}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - darukaa-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: darukaa-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-darukaa}:${POSTGRES_PASSWORD:-darukaa_dev_password}@db:5432/${POSTGRES_DB:-darukaa_earth}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    networks:
      - darukaa-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-}
    container_name: darukaa-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - darukaa-net

networks:
  darukaa-net:
    driver: bridge

volumes:
  darukaa_postgres_data:
    name: darukaa_postgres_data
